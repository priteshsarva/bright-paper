# Build command and publish directory are deliberately NOT set here: they live
# in the Netlify UI, and repeating them in this file would silently override
# whatever is configured there.

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The /api/chat rewrite lives in public/_redirects, not here: this file was not
# picked up on deploy (the build settings are configured in the Netlify UI), and
# the function 404'd until the rule moved into _redirects.
